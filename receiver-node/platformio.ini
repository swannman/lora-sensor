; Heltec WiFi LoRa 32 V4 (ESP32-S3 + SX1262 + 0.96" OLED) receiver for the
; M32JM pressure sensor node. The V4 uses the same pinout as the V3, so we
; target the V3 board variant.

[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200

build_flags =
    -I${PROJECT_DIR}/../shared
    ; LoRa modulation parameters MUST match the sensor node exactly.
    -DLORA_FREQ_HZ=917000000
    -DLORA_BW_KHZ=125
    -DLORA_SF=11
    -DLORA_CR=8
    -DLORA_TX_DBM=14            ; unused on RX-only path
    -DLORA_PREAMBLE=12
    -DLORA_SYNC_PRIVATE=0x12
    ; Receiver-specific tuning.
    -DDISPLAY_REFRESH_MS=1000
    -DRX_TIMEOUT_S=300

lib_deps =
    jgromes/RadioLib@^7.1.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.0.0
