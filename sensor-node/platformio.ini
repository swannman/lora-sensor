; RAK4631 (nRF52840 + SX1262) sensor node for M32JM-000105-100PG pressure transducer
; Custom LoRa P2P firmware. Pairs with a Heltec WiFi LoRa 32 V4 receiver.

[platformio]
default_envs = rak4631

; --- shared build settings --------------------------------------------------
[env]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
board_build.bsp.name = adafruit
board_build.bsp.maximum_size = 815104
board_build.variants_dir = variants
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/../shared
    -DCFG_DEBUG=0
    ; 917.0 MHz sits in the mid-gap between Meshtastic US channels 28 (916.82) and
    ; 29 (917.34), ~6.5 MHz from MeshCore's default (910.525), and off the smart-
    ; meter cluster around 915.0. Tuned for max range to an indoor receiver.
    -DLORA_FREQ_HZ=917000000
    -DLORA_BW_KHZ=125
    -DLORA_SF=11
    -DLORA_CR=8                 ; 4/8 — max FEC strength
    -DLORA_TX_DBM=22            ; SX1262 hardware max
    -DLORA_PREAMBLE=12          ; longer preamble helps RX sync at low SNR
    -DLORA_SYNC_PRIVATE=0x12
    -DSAMPLE_INTERVAL_S=15           ; faster event detection; sampling is ~µAh/day
    -DHEARTBEAT_INTERVAL_S=300       ; 5-min heartbeat — uses ~7 mAh/day, fits 12-mo budget
    -DTHRESHOLD_PSI_X100=50          ; 0.5 PSI delta triggers TX
    -DMIN_TX_COOLDOWN_S=10           ; min seconds between TX, regardless of how fast pressure changes
    -DNODE_ID=1
lib_deps =
    jgromes/RadioLib@^7.1.0

[env:rak4631]
upload_protocol = nrfutil
